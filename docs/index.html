<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precios Combustible</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <h1>Precios de Combustible</h1>
    <button id="menu-btn" class="menu-btn">☰</button>
  </header>

  <!-- Menú Hamburguesa -->
  <nav id="menu" class="menu">
    <a href="https://github.com/f-alonso-vendrell/precio-combustible/issues" target="_blank" class="menu-item">
      Reportar un error
    </a>
    <a href="https://github.com/f-alonso-vendrell/precio-combustible/blob/main/README.md" target="_blank" class="menu-item">
      Sobre este sitio
    </a>
    <a href="config/config.html" class="menu-item">
      ⚙️ Configuración
    </a>
    <a href="#" id="btn-borrar-datos" class="menu-item borrar-datos">
      Borrar mis datos
    </a>
  </nav>

  <div id="info-bar" class="info-bar">
    <div class="selector-row">
      <span class="label">Combustible:</span>
      <span id="combustible-actual" class="value">Ninguno seleccionado</span>
      <button id="btn-cambiar-combustible" class="btn-cambiar">Cambiar</button>
    </div>

    <div class="selector-row">
      <span class="label">Ubicación:</span>
      <span id="ubicacion-actual" class="value">No seleccionada</span>
      <button id="btn-cambiar-ubicacion" class="btn-cambiar">Cambiar</button>
    </div>

    <div class="fecha-row">
      Actualizado: <strong id="fecha-actualizacion">Cargando...</strong>
    </div>
  </div>

  <main>
    <table id="tabla-precios">
      <thead>
        <tr>
          <th>Estación</th>
          <th>Distancia</th>
          <th>Precio</th>
          <th>Como llegar</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <!-- Modales (mantengo los que ya tenías) -->
  <!-- Modal Combustible, Modal Ubicación, Cookie Banner... -->

  <script src="logic.js"></script>
</body>
</html>
